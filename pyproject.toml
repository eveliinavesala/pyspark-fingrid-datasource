[project]
name = "pyspark-fingrid-datasource"
version = "0.1.0"
description = "Access fingrid datasets via Apache Spark"
authors = [
    {name = "Chanukya Pekala",email = "chanukya.pekala@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark (>=4.1.1,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]

[tool.poetry]
name = "pyspark-fingrid-datasource"
version = "0.1.0"
description = "Access fingrid datasets via Apache Spark"
authors = ["Chanukya Pekala <chanukya.pekala@gmail.com>"]
readme = "README.md"
packages = [{include = "pyspark_fingrid", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
